<div class="notice">웹용: JavaScript iframe 전환 방식</div>

<script>
function loadPage(page, btn){
    const viewer = document.getElementById("viewer");
    viewer.src = page;

    document.querySelectorAll(".menuBtn").forEach(b => b.classList.remove("active"));
    if(btn) btn.classList.add("active");

    try {
        history.replaceState(null, "", "#" + page.replace(".html", ""));
    } catch(e) {}
}

window.addEventListener("DOMContentLoaded", () => {
    const hash = location.hash.replace("#", "");
    const firstBtn = document.querySelector(".menuBtn");

    if(hash) {
        const page = hash + ".html";
        const btn = [...document.querySelectorAll(".menuBtn")]
            .find(b => b.textContent.trim().startsWith(hash));
        loadPage(page, btn || firstBtn);
    } else {
        if(firstBtn) firstBtn.classList.add("active");
    }
});
</script>
